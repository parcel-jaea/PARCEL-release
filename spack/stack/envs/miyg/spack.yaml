# Miyabi-G (aarch64 Grace + GH200): PARCEL をゼロから入れる spack 環境
#   spack で作るもの: LLVM 18, AdaptiveCpp (hipsycl), OpenBLAS, binutils, Python と numpy / SciPy, PARCEL
#   既存品を使うもの: GCC 11.4.1 (OS), CUDA 12.6, Open MPI 4.1.6 (サイトの ompi-cuda)
#   @PARCEL_SRC@ と @PARCEL_REPO@ は install_stack.sh が置き換える
spack:
  specs:
  - parcel-sycl@1.2.0 ~mpi +cuda cuda_arch=90
  - py-parcel-sycl@1.2.0 ~mpi +cuda cuda_arch=90
  - parcel-sycl@1.2.0 +mpi +cuda cuda_arch=90
  - py-parcel-sycl@1.2.0 +mpi +cuda cuda_arch=90
  - py-scipy
  - py-pip
  concretizer:
    unify: when_possible
  view:
    default:
      root: .spack-env/view
      # parcel は構成違いを並べて入れるのでビューに入れない (spack load parcel-sycl+mpi のように構成を指定して読む)
      exclude: [parcel-sycl, py-parcel-sycl]
  repos:
    parcel: '@PARCEL_REPO@'
  develop:
    parcel-sycl:
      spec: parcel-sycl@=1.2.0
      path: '@PARCEL_SRC@'
    py-parcel-sycl:
      spec: py-parcel-sycl@=1.2.0
      path: '@PARCEL_SRC@'
  packages:
    tar:
      # spack の tar 1.35 は RHEL9 の libacl のヘッダと型が合わずビルドできない (Miyabi-G で確認)。OS の tar を使う
      buildable: false
      externals:
      - spec: tar@1.34
        prefix: /usr
    c:
      require: [gcc]
    cxx:
      require: [gcc]
    fortran:
      require: [gcc]
    gcc:
      buildable: false
      externals:
      - spec: gcc@11.4.1 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
    cuda:
      buildable: false
      externals:
      - spec: cuda@12.6.85
        prefix: /work/opt/local/aarch64/cores/cuda/12.6
    mpi:
      require: [openmpi]
    openmpi:
      buildable: false
      externals:
      - spec: openmpi@4.1.6+cuda
        prefix: /work/opt/local/aarch64/apps/gcc/11.4.1/openmpi-cuda/4.1.6-12.6
    hipsycl:
      require: ['@24.10.0 +cuda']
    llvm:
      # AdaptiveCpp 24.10 は LLVM 14〜18。使わない部品は作らない (lldb, lua, polly, flang, mlir)
      require: ['@18.1.8 +clang +lld ~lldb ~lua ~polly ~flang ~mlir ~python ~gold targets:=aarch64,nvptx']
    blas:
      require: [openblas]
    lapack:
      require: [openblas]
    python:
      require: ['@3.11']

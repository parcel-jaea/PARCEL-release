# PS-A (x86_64 Xeon 6980P): PARCEL をゼロから入れる spack 環境
#   spack で作るもの: LLVM 18, AdaptiveCpp (hipsycl), OpenBLAS, binutils, Python と numpy / SciPy, PARCEL
#   既存品を使うもの: GCC 11.5.0 (OS), Intel MPI 2021.18 (oneAPI 2026.1)
#   @PARCEL_SRC@ と @PARCEL_REPO@ は install_stack.sh が置き換える
#   PARCEL は ks_ortho=mgs (ks_arnoldi の直交化の既定を MGS2 に。-DPARCEL_KS_ORTHO_DEFAULT=mgs。PS-A では MGS2 が速い)
spack:
  specs:
  - parcel-sycl@1.2.0 ~mpi ~cuda ~rocm ks_ortho=mgs
  - py-parcel-sycl@1.2.0 ~mpi ~cuda ~rocm ks_ortho=mgs
  - parcel-sycl@1.2.0 +mpi ~cuda ~rocm ks_ortho=mgs
  - py-parcel-sycl@1.2.0 +mpi ~cuda ~rocm ks_ortho=mgs
  - py-scipy
  - py-pip
  concretizer:
    unify: when_possible
  view:
    default:
      root: .spack-env/view
      # parcel は構成違いを並べて入れるのでビューに入れない (spack load parcel-sycl+mpi のように構成を指定して読む)
      exclude: [parcel-sycl, py-parcel-sycl]
  repos:
    parcel: '@PARCEL_REPO@'
  develop:
    parcel-sycl:
      spec: parcel-sycl@=1.2.0
      path: '@PARCEL_SRC@'
    py-parcel-sycl:
      spec: py-parcel-sycl@=1.2.0
      path: '@PARCEL_SRC@'
  packages:
    all:
      # GCC 11 が sapphirerapids 向けに出す AVX-VNNI の命令を OS の binutils 2.35 が読めない (zlib-ng で失敗)。
      # 依存パッケージは x86_64_v4 で作る (PARCEL 本体は acpp が -march=native でコンパイルする)
      target: [x86_64_v4]
    tar:
      # spack の tar 1.35 は RHEL9 の libacl のヘッダと型が合わずビルドできない (Miyabi-G で確認)。OS の tar を使う
      buildable: false
      externals:
      - spec: tar@1.34
        prefix: /usr
    c:
      require: [gcc]
    cxx:
      require: [gcc]
    fortran:
      require: [gcc]
    gcc:
      buildable: false
      externals:
      - spec: gcc@11.5.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
    mpi:
      require: [intel-oneapi-mpi]
    intel-oneapi-mpi:
      buildable: false
      externals:
      - spec: intel-oneapi-mpi@2021.18
        prefix: /system/apps/rhel9/dev/oneapi/2026.1
    hipsycl:
      require: ['@24.10.0 ~cuda ~rocm']
    llvm:
      # AdaptiveCpp 24.10 は LLVM 14〜18。使わない部品は作らない (lldb, lua, polly, flang, mlir)
      require: ['@18.1.8 +clang +lld ~lldb ~lua ~polly ~flang ~mlir ~python ~gold targets:=x86']
    blas:
      require: [openblas]
    lapack:
      require: [openblas]
    python:
      require: ['@3.11']

# s86 (x86_64 Cascade Lake + V100): PARCEL をゼロから入れる spack 環境
#   spack で作るもの: LLVM 18, AdaptiveCpp (hipsycl), OpenBLAS, binutils, Python と numpy / SciPy, PARCEL
#   既存品を使うもの: GCC 9.5.0 (コンパイラ), CUDA 12.6 (ドライバが CUDA 12.8 まで), Open MPI 4.1.6 (gnu950, noncuda)
#   @PARCEL_SRC@ と @PARCEL_REPO@ は install_stack.sh が置き換える
spack:
  specs:
  - parcel-sycl@1.2.0 ~mpi ~cuda ~rocm
  - py-parcel-sycl@1.2.0 ~mpi ~cuda ~rocm
  - parcel-sycl@1.2.0 +mpi ~cuda ~rocm
  - py-parcel-sycl@1.2.0 +mpi ~cuda ~rocm
  - parcel-sycl@1.2.0 ~mpi +cuda cuda_arch=70
  - py-parcel-sycl@1.2.0 ~mpi +cuda cuda_arch=70
  - parcel-sycl@1.2.0 +mpi +cuda cuda_arch=70
  - py-parcel-sycl@1.2.0 +mpi +cuda cuda_arch=70
  - py-scipy
  - py-pip
  concretizer:
    unify: when_possible
  view:
    default:
      root: .spack-env/view
      # parcel は構成違いを並べて入れるのでビューに入れない (spack load parcel-sycl+cuda+mpi のように構成を指定して読む)
      exclude: [parcel-sycl, py-parcel-sycl]
  repos:
    parcel: '@PARCEL_REPO@'
  develop:
    parcel-sycl:
      spec: parcel-sycl@=1.2.0
      path: '@PARCEL_SRC@'
    py-parcel-sycl:
      spec: py-parcel-sycl@=1.2.0
      path: '@PARCEL_SRC@'
  packages:
    c:
      require: [gcc]
    cxx:
      require: [gcc]
    fortran:
      require: [gcc]
    gcc:
      buildable: false
      externals:
      - spec: gcc@9.5.0 languages:='c,c++,fortran'
        prefix: /home/app/gcc/9.5.0
        extra_attributes:
          compilers:
            c: /home/app/gcc/9.5.0/bin/gcc
            cxx: /home/app/gcc/9.5.0/bin/g++
            fortran: /home/app/gcc/9.5.0/bin/gfortran
    cuda:
      buildable: false
      externals:
      - spec: cuda@12.6.20
        prefix: /home/app/cuda/12.6
    mpi:
      require: [openmpi]
    openmpi:
      buildable: false
      externals:
      - spec: openmpi@4.1.6~cuda+cxx~cxx_exceptions~java~memchecker+pmi~rocm~static~wrapper-rpath fabrics=ucx schedulers=tm
        prefix: /home/app/mpi/el8/noncuda/openmpi/4.1.6_gnu950
    hipsycl:
      require: ['@24.10.0 +cuda']
    llvm:
      # AdaptiveCpp 24.10 は LLVM 14〜18。使わない部品は作らない (lldb, lua, polly, flang, mlir)
      require: ['@18.1.8 +clang +lld ~lldb ~lua ~polly ~flang ~mlir ~python ~gold targets:=x86,nvptx']
    blas:
      require: [openblas]
    lapack:
      require: [openblas]
    python:
      require: ['@3.11']
